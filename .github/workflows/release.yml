name: Release

# Push a tag like v0.1.0 to build Macsplorer.app, the Linux tarballs, the Termux
# tarball and the Android APK and attach them to one GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Add Intel target
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test
        run: cargo test --workspace
      - name: Bundle universal app
        run: scripts/bundle-macos.sh --universal
      - name: Zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent target/release/Macsplorer.app Macsplorer-macOS.zip
          shasum -a 256 Macsplorer-macOS.zip > Macsplorer-macOS.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Macsplorer-macOS
          path: Macsplorer-macOS.zip*

  linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test
        run: cargo test --workspace
      - name: Bundle
        run: |
          scripts/bundle-linux.sh
          mv target/release/macsplorer-linux-${{ matrix.arch }}.tar.gz Macsplorer-linux-${{ matrix.arch }}.tar.gz
          sha256sum Macsplorer-linux-${{ matrix.arch }}.tar.gz > Macsplorer-linux-${{ matrix.arch }}.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Macsplorer-linux-${{ matrix.arch }}
          path: Macsplorer-linux-${{ matrix.arch }}.tar.gz*

  termux:
    # Cross-compiled with the NDK that ubuntu-latest carries: for Termux:X11 on Android, see scripts/bundle-termux.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Add Android target
        run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Bundle
        run: |
          scripts/bundle-termux.sh
          mv target/release/macsplorer-termux-aarch64.tar.gz Macsplorer-termux-aarch64.tar.gz
          sha256sum Macsplorer-termux-aarch64.tar.gz > Macsplorer-termux-aarch64.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Macsplorer-termux-aarch64
          path: Macsplorer-termux-aarch64.tar.gz*

  android:
    # The APK is what Obtainium installs. The file name has no version in it, so an Obtainium filter
    # such as `Macsplorer-android.*\.apk$` keeps matching. Updates only install over the app when every
    # release is signed with the same key, hence the keystore secrets and no fallback to the debug key.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Add Android target
        run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0 --locked
      - name: Android SDK platform
        # package-android.sh compiles against platform 34; the runner image usually has it.
        run: |
          [ -d "$ANDROID_HOME/platforms/android-34" ] || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34"
      - name: Signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || { echo "::error::ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD secrets are missing"; exit 1; }
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build
        run: |
          scripts/build-android.sh
          cp target/release/apk/macsplorer.apk Macsplorer-android-arm64.apk
          sha256sum Macsplorer-android-arm64.apk > Macsplorer-android-arm64.apk.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Macsplorer-android-arm64
          path: Macsplorer-android-arm64.apk*

  release:
    # Only when every build succeeded, so a release never ships one platform.
    needs: [macos, linux, termux, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Macsplorer ${GITHUB_REF_NAME#v}" --generate-notes
