name: Release

# Push a tag like v0.1.0 to build Macsplorer.app and the Linux tarball and attach
# both to one GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Add Intel target
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test
        run: cargo test --workspace
      - name: Bundle universal app
        run: scripts/bundle-macos.sh --universal
      - name: Zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent target/release/Macsplorer.app Macsplorer-macOS.zip
          shasum -a 256 Macsplorer-macOS.zip > Macsplorer-macOS.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Macsplorer-macOS
          path: Macsplorer-macOS.zip*

  linux:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test
        run: cargo test --workspace
      - name: Bundle
        run: |
          scripts/bundle-linux.sh
          mv target/release/macsplorer-linux-${{ matrix.arch }}.tar.gz Macsplorer-linux-${{ matrix.arch }}.tar.gz
          sha256sum Macsplorer-linux-${{ matrix.arch }}.tar.gz > Macsplorer-linux-${{ matrix.arch }}.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Macsplorer-linux-${{ matrix.arch }}
          path: Macsplorer-linux-${{ matrix.arch }}.tar.gz*

  release:
    # Only when both builds succeeded, so a release never ships one platform.
    needs: [macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Macsplorer ${GITHUB_REF_NAME#v}" --generate-notes
