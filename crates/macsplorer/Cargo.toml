[package]
name = "macsplorer"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.36.2"
egui_extras = "0.36.2"
macsplorer-core = { version = "1.0.0", path = "../macsplorer-core" }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSURL", "NSArray", "NSFileManager", "NSError", "NSDate", "NSDateFormatter", "NSFormatter", "NSLocale", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSPasteboard", "NSPasteboardItem", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSView", "NSResponder", "NSWindow", "NSEvent", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSApplication", "NSCursor", "objc2-core-foundation"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.190"

[target.'cfg(not(target_os = "macos"))'.dependencies]
trash = "5.2.9"
