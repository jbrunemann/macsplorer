[package]
name = "macsplorer"
version.workspace = true
edition.workspace = true

# The desktop program is `main.rs`; the Android app is `crates/macsplorer-android`, which hands its activity to
# `run_android`.
[lib]
path = "src/lib.rs"

[[bin]]
name = "macsplorer"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
egui_extras = "0.36.2"
egui-classic-menu = { version = "2.0.1", path = "../egui-classic-menu" }
macsplorer-core = { version = "2.0.1", path = "../macsplorer-core" }
update-check = { version = "2.0.1", path = "../update-check" }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs", "aes-crypto"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "0.36.2"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2.190"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "android-native-activity"] }
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.21"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSURL", "NSArray", "NSBundle", "NSFileManager", "NSError", "NSDate", "NSDateFormatter", "NSFormatter", "NSLocale", "NSDictionary", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSImage", "NSImageRep", "NSPasteboard", "NSPasteboardItem", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSFont", "NSStringDrawing", "NSAttributedString", "NSView", "NSResponder", "NSWindow", "NSEvent", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSApplication", "NSCursor", "objc2-core-foundation"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
fontdb = "0.24.0"
libc = "0.2.190"

[target.'cfg(not(any(target_os = "macos", target_os = "android")))'.dependencies]
trash = "5.2.9"
