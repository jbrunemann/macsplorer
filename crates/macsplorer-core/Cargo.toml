[package]
name = "macsplorer-core"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
libc = "0.2.190"
serde_json = "1.0.154"
notify = "8.2.0"
icu_collator = "2.3.1"
icu_normalizer = "2.3.0"
icu_locale_core = "2.3.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSString", "NSArray", "NSDictionary", "NSError", "NSValue"] }
